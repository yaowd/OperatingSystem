    report_template: homework/Lab4/Lab4.md
    required_files:
      - Lab4.md
      - imgs/lab4_pointer.png
      - imgs/lab4_memory_maps.png
    # 延续 Lab2 起对新作业启用的行数与 Markdown 符号数量检查；已发布的 Lab1、Lab2、Lab3 保持原有规则。
    template_metrics:
